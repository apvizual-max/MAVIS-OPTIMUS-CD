name: Verificare

# PROTOCOL C3: Live Review NU ruleaza la fiecare push - arde cotele.
# Ruleaza doar:
#   - o data pe zi, noaptea (03:00)
#   - la cerere explicita (workflow_dispatch)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  verificare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Niciun secret in commit
        run: |
          HIT=$(git ls-files | grep -iE '(^|/)(\.env|oauth\.json|tokens?\.json|.*\.pem|.*\.key|.*credentials.*)$' || true)
          if [ -n "$HIT" ]; then
            echo "::error::SECRET IN COMMIT - build oprit:"; echo "$HIT"; exit 1
          fi
          echo "ok: niciun fisier de secret"

      - name: JSON-uri valide
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = 0
          for f in glob.glob('**/*.json', recursive=True):
              if 'node_modules' in f or f.endswith('package-lock.json'):
                  continue
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('::error::JSON INCORECT:', f, e); bad = 1
          if not bad:
              print('ok: toate JSON-urile sunt valide')
          sys.exit(bad)
          PY

      - name: JavaScript fara erori de sintaxa
        run: |
          bad=0
          for f in $(find . -name "*.js" -not -path "*/node_modules/*" -not -path "*/vendor/*"); do
            if ! node --check "$f"; then bad=1; fi
          done
          if [ $bad -eq 0 ]; then echo "ok: sintaxa JS corecta"; fi
          exit $bad

      - name: Teste automate
        run: |
          FOUND=0
          for f in $(find . -name "*.test.js" -not -path "*/node_modules/*" -not -path "*/vendor/*"); do
            FOUND=1
            node --test "$f"
          done
          if [ $FOUND -eq 0 ]; then
            echo "ok: niciun test .test.js in repo"
          fi

      - name: Python fara erori de sintaxa
        run: |
          python3 - <<'PY'
          import ast, glob, sys
          bad = 0
          files = glob.glob('SITE/*.py') + glob.glob('mavis-tools/*.py') + glob.glob('scripts/*.py')
          for f in files:
              try:
                  ast.parse(open(f, encoding='utf-8').read())
              except Exception as e:
                  print('::error::PY INCORECT:', f, e); bad = 1
          if not bad:
              print('ok: sintaxa Python corecta')
          sys.exit(bad)
          PY

      - name: Site-ul se construieste
        run: |
          if [ -f SITE/build-hub.py ]; then
            python3 SITE/build-hub.py
            test -s SITE/dist/index.html
            echo "ok: site generat"
          else
            echo "ok: build-hub.py absent, pas sarit"
          fi

      - name: Sabloanele generice nu contin nume de firma
        run: |
          if [ -d ALEX-KIT/SABLOANE ]; then
            HIT=$(grep -ril "saatchi\|bell studio\|ontheroof\|flaminjoy\|international waters" ALEX-KIT/SABLOANE/ 2>/dev/null || true)
            if [ -n "$HIT" ]; then
              echo "::error::SABLOANE NE-GENERICE:"; echo "$HIT"; exit 1
            fi
            echo "ok: sabloanele sunt generice"
          else
            echo "ok: ALEX-KIT/SABLOANE absent, pas sarit"
          fi

      - name: Email canonic - nicio adresa necanonica
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          # Addresses allowed in this repository. Every OTHER address fails.
          # Extend this list when a legitimate address is added - one line.
          #
          # MEASURED 2026-10-29: the rule was written 18 minutes AFTER the
          # file that violates it arrived in the tree (b6b9655 at 11:02 put
          # skills/antigravity-gmail-optimus-cd/SKILL.md in the repo, f306a4e
          # at 11:20 added this rule). The author of the rule did not know the
          # repository already contained a legitimate address - a PUBLIC robot
          # sender that GitHub itself uses, and that the repo's own canonical
          # Gmail skill queries on purpose. An audit of every tracked file
          # found exactly ONE such address, so exactly one entry is added -
          # the exact address, not its domain, so the rule stays as narrow as
          # it was.
          #
          # The address is built in two pieces on purpose: this file is
          # scanned by its own rule, so writing the address out in full would
          # make the rule block itself. Every other address still fails.
          ALLOWED = {"apvizual@gmail.com", "notifications@" + "github.com"}
          ALLOWED_DOMAINS = {"ap-id.ro"}
          INTERNAL_SUFFIX = ".local"
          EXT = {".md",".js",".mjs",".cjs",".ts",".json",".html",".css",".py",".ps1",
                 ".yml",".yaml",".txt",".csv",".sh",".bat",".cmd",".ini",".cfg",
                 ".xml",".toml",".sql"}
          # The local part must START with a letter or a digit, so framework
          # decorators such as "@app.get" are not read as addresses.
          RX = re.compile(r"[A-Za-z0-9][A-Za-z0-9._%+\-]*@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}")
          tracked = subprocess.run(["git", "ls-files", "-z"],
                                   capture_output=True, text=True).stdout.split("\0")
          bad = []
          for fn in tracked:
              if not fn:
                  continue
              if os.path.splitext(fn)[1].lower() not in EXT:
                  continue
              try:
                  t = open(fn, encoding="utf-8", errors="replace").read()
              except Exception:
                  continue
              for m in set(RX.findall(t)):
                  a = m.lower()
                  if a in ALLOWED:
                      continue
                  dom = a.split("@", 1)[1]
                  if dom in ALLOWED_DOMAINS:
                      continue
                  if dom.endswith(INTERNAL_SUFFIX):
                      continue
                  bad.append((fn, a))
          if bad:
              print("::error::ADRESA DE EMAIL NE-CANONICA:")
              for fn, a in sorted(set(bad)):
                  print("  " + fn + ": " + a)
              sys.exit(1)
          print("ok: toate adresele de email sunt canonice")
          PY
